name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy koottam
      - run: pytest -q   # offline: no network, no model, no keys

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just HEAD
      # The gitleaks action scans "first pushed commit^..last", which fails when the push
      # includes the root commit. Running the CLI scans every commit, root included.
      - name: gitleaks (full history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' -O - | tar xz gitleaks
          ./gitleaks git . --redact --no-banner
