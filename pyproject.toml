[project]
name = "koottam"
version = "0.1.0"
description = "A council of open-weight models on different servers, distilled into one small model"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyarrow>=15",      # the prompt-injection dataset ships as parquet
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["koottam"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells read top to bottom on one screen: imports sit next to their use, and the
# install cell is Unsloth's own recipe, kept verbatim so it can be compared with upstream.
"*.ipynb" = ["E402", "E501", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
