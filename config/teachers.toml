# Every model Koottam can talk to. All speak the OpenAI-compatible chat API, so the only
# differences are base_url, model id, key and pace.
#
# Model ids were checked on 2026-09-27 against each provider's docs. Free catalogues
# change often: if a call returns 404, re-check the list and edit here.
#
# rpm = requests per minute we allow ourselves. Keep it at or under the provider's free
# limit; the client also backs off on HTTP 429 and honours Retry-After.
#
# One member per provider, on purpose. Free tiers cap requests per DAY per account, so
# putting two members on one provider halves each one's budget. OpenRouter's free tier,
# for example, is 50 requests/day (read from GET /api/v1/key, 2026-09-27): far too few for
# a council member, but fine for the aggregator, which only sees ties.

# ─── the council ───────────────────────────────────────────
# Four members on four different servers, from three companies' model families
# (OpenAI, Alibaba, Google).
# Diversity is the point: voting only helps when members make *different* mistakes.

[teachers.gpt-oss]
provider = "cerebras"
base_url = "https://api.cerebras.ai/v1"
model = "gpt-oss-120b"
api_key_env = "CEREBRAS_API_KEY"
# Limits read from the response headers on 2026-09-27: 5/min, 150/HOUR, 2,400/day,
# 1M tokens/day. The hourly cap binds first, so 2.5/min. Paid from the $5 of signup
# credit (auto-recharge off; the credit expires 2026-10-28); ~300 tokens per answer.
rpm = 2.5

[teachers.qwen-27b]
provider = "groq"
base_url = "https://api.groq.com/openai/v1"
# Llama 3.3 70B was the plan, but Groq's free plan no longer lists it (404; its docs
# mark it Enterprise). The free list on 2026-09-27 was gpt-oss-120b/20b and Qwen 3.8.
model = "qwen/qwen3.8-27b"
api_key_env = "GROQ_API_KEY"
rpm = 20                      # headers: 1,000 requests/day, 8,000 tokens/min

[teachers.gemma-31b]
provider = "google"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemma-4-31b-it"
api_key_env = "GOOGLE_API_KEY"
# Slow (~40 s: it always thinks, and the API refuses to turn that off) and sometimes
# returns 500, which the client retries. Its <thought> block is stripped by the client.
rpm = 15
max_tokens = 8192             # at 2048 it thought itself out of an answer (2026-09-27)

[teachers.gemma-local]
provider = "ollama"            # the laptop: a server we own
base_url = "http://localhost:11434/v1"
model = "gemma4:e2b"
rpm = 60
concurrency = 1               # the CPU answers one at a time; more just queue past the timeout
# Thinking off: on this laptop's CPU it cuts ~60 s to ~13 s per question (measured
# 2026-09-26, Ollama 0.23.3). Still the council's slowest member: ~2 h for the test set.
extra = { reasoning_effort = "none" }

# ─── the aggregator ────────────────────────────────────────
# Breaks ties. Deliberately a family that is NOT on the council, so it has no own
# answer to be biased towards. Only `eval --council` uses it: `build` never does, because a
# tie can never reach min_agree, so its verdict could not become a training example anyway.
[aggregator]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
# NVIDIA's Nemotron: not on the council. Qwen 3.8 27B was the first choice, but on
# 2026-09-27 its :free pool (shared by every free user) returned 429 "rate-limited
# upstream" on every try, as did Gemma's; Nemotron's pool answered.
model = "nvidia/nemotron-3-super-120b-a12b:free"
api_key_env = "OPENROUTER_API_KEY"
rpm = 10                       # but only 50 requests/day on the free tier

# ─── students ──────────────────────────────────────────────
# Models under test that are NOT council members: the base student before training and
# the fine-tuned one after. Both are Gemma 3 1B instruct, exported by train/finetune.ipynb
# through the same GGUF pipeline (Q8_0) and registered by `python -m koottam students`
# with the same template, so the only difference between them is the training.
# Gemma 3 1B, not Gemma 4 E2B: E2B is a council member, so it would be trained partly on
# its own answers. 1B is also small enough to leave room to improve.
[students.student-base]
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "koottam-base"         # the untrained student, created by `koottam students`
rpm = 60
concurrency = 1
extra = { reasoning_effort = "none" }   # same settings as the fine-tuned student, or the comparison is unfair

[students.student-koottam]
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "koottam-student"      # the fine-tuned student, created by `koottam students`
rpm = 60
concurrency = 1
extra = { reasoning_effort = "none" }

[council]
members = ["gpt-oss", "qwen-27b", "gemma-31b", "gemma-local"]
# A training example is kept only when at least this many members agree
# AND the agreed answer matches the answer key.
min_agree = 3
